<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Volumen-Einheiten</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/utils.js"></script>
    <script src="../../js/quiz-core.js"></script>
    <script src="../../js/units/units.js"></script>
    <script src="../../js/units/volume.js"></script>
</head>
<body>
    <div id="container" class="container">

        <div id="quiz-view">
            <h1>Volumen-Einheiten</h1>
            <p class="progress">Frage 1 / 15</p>
            <p class="task"></p>
            <input type="text" id="answer" inputmode="decimal">
            <p id="feedback" class="feedback"></p>

            <button class="button-check">Prüfen</button>
            <button class="button-next">Weiter</button>
            <button class="button-cancel" data-target="units.html">Abbrechen</button>
            <button class="button-intermediate">Zwischenstand</button>

            <div class="intermediate" style="display:none"></div>
        </div>

        <div id="result-view" style="display:none">
            <h1>Auswertung</h1>
            <p id="result-text"></p>
            <button class="button-result" data-action="retry">Nochmal</button>
            <button class="button-result-units" data-action="selection">Zurück zur Auswahlseite</button>
        </div>

    </div>
</body>
</html>
